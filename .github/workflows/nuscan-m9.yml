          sed 's/^[[:space:]]*//' /tmp/nuscan-m9.b64 | base64 --decode > /tmp/nuscan-m9.tar.gz
          tar -xzf /tmp/nuscan-m9.tar.gz -C .
          chmod +x gradlew || true

      - name: Build debug APK
        id: debug_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/nuscan-debug.log

      - name: Upload debug APK
        if: steps.debug_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M9-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release candidate AAB
        id: release_build
        if: steps.debug_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:bundleRelease --stacktrace 2>&1 | tee /tmp/nuscan-release.log

      - name: Upload release candidate AAB
        if: steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M9-release-candidate-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create diagnose bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nuscan-diagnose
          mkdir -p /tmp/nuscan-diagnose
          cp /tmp/nuscan-debug.log /tmp/nuscan-diagnose/debug-build.log 2>/dev/null || true
          cp /tmp/nuscan-release.log /tmp/nuscan-diagnose/release-build.log 2>/dev/null || true
          cp app/build.gradle.kts /tmp/nuscan-diagnose/app-build.gradle.kts 2>/dev/null || true
          cp app/proguard-rules.pro /tmp/nuscan-diagnose/proguard-rules.pro 2>/dev/null || true
          cp app/src/main/AndroidManifest.xml /tmp/nuscan-diagnose/AndroidManifest.xml 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/ScannerPage.kt /tmp/nuscan-diagnose/ScannerPage.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/scan/ScanEnhancementEngine.kt /tmp/nuscan-diagnose/ScanEnhancementEngine.kt 2>/dev/null || true
          {
            echo "NUSCAN M9 SCAN QUALITY DIAGNOSE"
            echo "================================"
            echo "Debug outcome: ${{ steps.debug_build.outcome }}"
            echo "Release outcome: ${{ steps.release_build.outcome }}"
            echo
            echo "PRIMARY ERROR CANDIDATES"
            grep -hEn "(^|[[:space:]])(e:|error:|FAILURE:|Execution failed|Unresolved reference|Argument type mismatch|Cannot access|Missing class|OutOfMemoryError)" /tmp/nuscan-debug.log /tmp/nuscan-release.log 2>/dev/null | tail -n 160 || true
          } > /tmp/nuscan-diagnose/summary.txt
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/NuScan-M9-diagnose.zip" nuscan-diagnose

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M9-diagnose
          path: NuScan-M9-diagnose.zip
          if-no-files-found: error

      - name: Commit M9 source after successful debug build
        if: steps.debug_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "NuScan M9: scan quality engine v1"
            git push
          fi

      - name: Fail workflow when a build failed
        if: always()
        shell: bash
        run: |
          debug="${{ steps.debug_build.outcome }}"
          release="${{ steps.release_build.outcome }}"
          if [ "$debug" != "success" ]; then
            echo "Debug APK build failed. See NuScan-M9-diagnose."
            exit 1
          fi
          if [ "$release" != "success" ]; then
            echo "Debug APK succeeded, but release AAB failed. APK artifact is still available."
            exit 1
          fi
