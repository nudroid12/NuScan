      - name: Generate standard Gradle wrapper
        if: steps.bootstrap.outputs.created == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle wrapper --gradle-version 8.13 2>&1 | tee wrapper-generation.log
          exit 0

      - name: Commit bootstrapped project
        if: steps.bootstrap.outputs.created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap NuScan M1 [skip ci]"
          git push

      - name: Build debug APK
        id: appbuild
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee gradle-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnose
          cp gradle-build.log diagnose/gradle-build.log 2>/dev/null || true
          cp wrapper-generation.log diagnose/wrapper-generation.log 2>/dev/null || true
          gradle --version > diagnose/gradle-version.txt 2>&1 || true
          java -version > diagnose/java-version.txt 2>&1 || true
          git status --short > diagnose/git-status.txt 2>&1 || true
          find . -maxdepth 6 -type f \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -not -path './app/build/*' \
            | sort > diagnose/project-files.txt

          {
            echo "NUSCAN BUILD DIAGNOSE"
            echo "===================="
            echo
            if [ "${{ steps.appbuild.outputs.exit_code }}" = "0" ]; then
              echo "RESULT: SUCCESS"
            else
              echo "RESULT: FAILED"
            fi
            echo "BUILD EXIT CODE: ${{ steps.appbuild.outputs.exit_code }}"
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            if [ -f gradle-build.log ]; then
              grep -nE '(^e: |FAILURE:|What went wrong:|Execution failed for task|Could not resolve|Could not find|error: |Exception|Caused by:)' gradle-build.log | tail -n 140 || true
            fi
          } > diagnose/summary.txt

          zip -qr NuScan-M1-diagnose.zip diagnose

      - name: Upload debug APK
        if: steps.appbuild.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M1-diagnose
          path: NuScan-M1-diagnose.zip
          if-no-files-found: error

      - name: Mark failed build
        if: steps.appbuild.outputs.exit_code != '0'
        run: exit 1
