      - name: Build debug APK
        id: debug_build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee debug-build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload debug APK
        if: steps.debug_build.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M10-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit validated M10 source
        if: steps.debug_build.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "NuScan M10 free updater and signed release"
            git push
          fi

      - name: Prepare permanent release signing
        id: signing
        if: steps.debug_build.outputs.code == '0'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NUSCAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NUSCAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUSCAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUSCAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured. Debug APK remains available."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/nuscan-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        id: release_build
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace 2>&1 | tee release-build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify permanent release signature
        id: verify_release
        if: steps.release_build.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-signing.txt
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' release-signing.txt | head -n1 | sed 's/.*digest: //' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          EXPECTED='f7fded70b638e849c2959eb61eef453a82e6db1ef5e493d3b837cfb6eaf081f8'
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Release certificate fingerprint does not match the permanent NuScan key." >&2
            echo "Expected: $EXPECTED" >&2
            echo "Actual:   $ACTUAL" >&2
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: steps.verify_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M10-signed-release-apk
          path: ${{ steps.verify_release.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release and update metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.verify_release.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          TAG="v$VERSION"
          ASSET="NuScan-$VERSION.apk"
          cp "${{ steps.verify_release.outputs.apk }}" "/tmp/$ASSET"
          SHA256=$(sha256sum "/tmp/$ASSET" | awk '{print $1}')
          printf '%s\n' "$RELEASE_NOTES" > /tmp/release-notes.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/$ASSET" --clobber
            gh release edit "$TAG" --title "NuScan $VERSION" --notes-file /tmp/release-notes.txt
          else
            EXTRA=()
            if [[ "$VERSION" == *"-rc"* ]]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" "/tmp/$ASSET" --title "NuScan $VERSION" --notes-file /tmp/release-notes.txt "${EXTRA[@]}"
          fi

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ASSET"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            --arg changelog "$RELEASE_NOTES" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,changelog:$changelog,mandatory:false}' \
            > update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish NuScan $VERSION update metadata"
            git push
          fi

      - name: Build diagnose bundle
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnose
          cp debug-build.log diagnose/ 2>/dev/null || true
          cp release-build.log diagnose/ 2>/dev/null || true
          cp release-signing.txt diagnose/ 2>/dev/null || true
          cp app/build/outputs/mapping/release/missing_rules.txt diagnose/ 2>/dev/null || true
          cp app/build.gradle.kts diagnose/ 2>/dev/null || true
          cp app/src/main/AndroidManifest.xml diagnose/ 2>/dev/null || true
          cp update.json diagnose/ 2>/dev/null || true
          {
            echo "NuScan M10 Diagnose"
            echo "=================="
            echo "Debug exit code: ${{ steps.debug_build.outputs.code || 'not-run' }}"
            echo "Signing ready: ${{ steps.signing.outputs.ready || 'not-run' }}"
            echo "Release exit code: ${{ steps.release_build.outputs.code || 'not-run' }}"
            echo "Release verify: ${{ steps.verify_release.outcome || 'not-run' }}"
          } > diagnose/summary.txt
          zip -qr NuScan-M10-diagnose.zip diagnose

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M10-diagnose
          path: NuScan-M10-diagnose.zip
          if-no-files-found: warn

      - name: Final status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.debug_build.outputs.code }}" != "0" ]; then
            echo "Debug build failed."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; then
            if [ "${{ steps.signing.outputs.ready }}" != "true" ]; then
              echo "Publishing was requested but release signing secrets are missing."
              exit 1
            fi
            if [ "${{ steps.release_build.outputs.code }}" != "0" ] || [ "${{ steps.verify_release.outcome }}" != "success" ]; then
              echo "Publishing was requested but signed release build or verification failed."
              exit 1
            fi
          fi
