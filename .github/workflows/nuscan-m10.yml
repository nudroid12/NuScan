name: NuScan M10 Free Updater and Signed Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish signed APK to GitHub Releases and update update.json'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Release notes shown on GitHub and inside NuScan'
        required: false
        default: 'NuScan improvements and bug fixes.'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuscan-m10.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Apply NuScan M10 source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          find .github/workflows -maxdepth 1 -type f -name 'nuscan-*.yml' ! -name 'nuscan-m10.yml' -delete || true
