          chmod +x gradlew || true

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.7.2-scanfix"' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q 'val cameraxVersion = "1.6.1"' app/build.gradle.kts
          grep -q 'org.opencv:opencv:4.9.0' app/build.gradle.kts
          ! grep -q 'play-services-mlkit-document-scanner' app/build.gradle.kts
          test -f app/src/main/java/com/nudroidlabs/nuscan/scan/DocumentEdgeDetector.kt
          test -f app/src/main/java/com/nudroidlabs/nuscan/scan/PerspectiveCorrector.kt
          test -f app/src/main/java/com/nudroidlabs/nuscan/scan/AutoCaptureTracker.kt
          grep -q 'setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)' app/src/main/java/com/nudroidlabs/nuscan/ScannerPage.kt
          grep -q 'CAPTURE_MODE_MAXIMIZE_QUALITY' app/src/main/java/com/nudroidlabs/nuscan/ScannerPage.kt
          grep -q 'getPerspectiveTransform' app/src/main/java/com/nudroidlabs/nuscan/scan/PerspectiveCorrector.kt
          grep -q 'calculateSharpness' app/src/main/java/com/nudroidlabs/nuscan/scan/DocumentEdgeDetector.kt
          grep -Fq -- '-dontwarn com.gemalto.jp2.**' app/proguard-rules.pro

      - name: Build debug APK
        id: debug_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/nuscan-m7-2-debug-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Build release candidate AAB
        id: release_build
        if: ${{ steps.debug_build.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:bundleRelease 2>&1 | tee /tmp/nuscan-m7-2-release-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload debug APK
        if: ${{ always() && steps.debug_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.2-scanfix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release candidate AAB
        if: ${{ always() && steps.release_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.2-scanfix-release-candidate-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit verified scan-fix source
        if: ${{ steps.debug_build.outcome == 'success' && steps.release_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat gradle README.md THIRD_PARTY_NOTICES.md PLAY_STORE_RELEASE_CHECKLIST.md PRIVACY_POLICY_TEMPLATE.md SCAN_FIX_NOTES.md
          if ! git diff --cached --quiet; then
            git commit -m "NuScan 0.7.2 scan perspective fix"
            git push
          fi

      - name: Prepare diagnose
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nuscan-m7-2-diagnose
          cp /tmp/nuscan-m7-2-debug-build.log /tmp/nuscan-m7-2-diagnose/debug-build.log 2>/dev/null || true
          cp /tmp/nuscan-m7-2-release-build.log /tmp/nuscan-m7-2-diagnose/release-build.log 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/ScannerPage.kt /tmp/nuscan-m7-2-diagnose/ScannerPage.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/scan/DocumentEdgeDetector.kt /tmp/nuscan-m7-2-diagnose/DocumentEdgeDetector.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/scan/PerspectiveCorrector.kt /tmp/nuscan-m7-2-diagnose/PerspectiveCorrector.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/scan/AutoCaptureTracker.kt /tmp/nuscan-m7-2-diagnose/AutoCaptureTracker.kt 2>/dev/null || true
          cp app/build.gradle.kts /tmp/nuscan-m7-2-diagnose/app-build.gradle.kts 2>/dev/null || true
          cp app/src/main/AndroidManifest.xml /tmp/nuscan-m7-2-diagnose/AndroidManifest.xml 2>/dev/null || true
          cp app/proguard-rules.pro /tmp/nuscan-m7-2-diagnose/proguard-rules.pro 2>/dev/null || true
          find app/build -name missing_rules.txt -exec cp {} /tmp/nuscan-m7-2-diagnose/missing_rules.txt \; 2>/dev/null || true
          {
            echo "NUSCAN M7.2 SCAN FIX DIAGNOSE"
            echo "=============================="
            echo
            echo "DEBUG STEP: ${{ steps.debug_build.outcome || 'not-run' }}"
            echo "DEBUG BUILD EXIT CODE: ${{ steps.debug_build.outputs.exit_code || 'not-run' }}"
            echo "RELEASE STEP: ${{ steps.release_build.outcome || 'not-run' }}"
            echo "RELEASE BUILD EXIT CODE: ${{ steps.release_build.outputs.exit_code || 'not-run' }}"
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            grep -nE '(^e: |FAILURE:|Execution failed|Unresolved reference|Cannot infer|error:|Exception|Missing class|Could not find)' /tmp/nuscan-m7-2-debug-build.log /tmp/nuscan-m7-2-release-build.log 2>/dev/null | head -160 || true
            echo
            echo "SCAN DEPENDENCIES"
            echo "-----------------"
            grep -E 'camera-|opencv:|exifinterface:|compileSdk|targetSdk|versionCode|versionName' app/build.gradle.kts || true
          } > /tmp/nuscan-m7-2-diagnose/summary.txt

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.2-scanfix-diagnose
          path: /tmp/nuscan-m7-2-diagnose/
          if-no-files-found: warn
