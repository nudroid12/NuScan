      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.7.1-m7.1"' app/build.gradle.kts
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -Fq -- '-dontwarn com.gemalto.jp2.**' app/proguard-rules.pro
          ! grep -R 'Icons.Default.CallMerge' app/src/main/java
          grep -R -q 'Icons.AutoMirrored.Filled.CallMerge' app/src/main/java
          test -f app/src/main/java/com/nudroidlabs/nuscan/monetization/PrivacyConsentController.kt
          test -f PLAY_STORE_RELEASE_CHECKLIST.md
          test -f PRIVACY_POLICY_TEMPLATE.md
          grep -q 'com.android.billingclient:billing:9.1.0' app/build.gradle.kts
          grep -q 'com.google.android.ump:user-messaging-platform:4.0.0' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'com.google.mlkit.vision.codescanner' app/src/main/java/com/nudroidlabs/nuscan/QrToolsPage.kt
          ! grep -R 'com.google.android.gms.codescanner' app/src/main/java
          ! grep -R 'setOfferToken' app/src/main/java/com/nudroidlabs/nuscan/monetization/ProBillingController.kt

      - name: Build debug APK
        id: debug_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/nuscan-m7-1-debug-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Build release candidate AAB
        id: release_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:bundleRelease 2>&1 | tee /tmp/nuscan-m7-1-release-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload debug APK
        if: ${{ always() && steps.debug_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release candidate AAB
        if: ${{ always() && steps.release_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.1-release-candidate-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit verified M7.1 source
        if: ${{ steps.debug_build.outcome == 'success' && steps.release_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat gradle README.md THIRD_PARTY_NOTICES.md PLAY_STORE_RELEASE_CHECKLIST.md PRIVACY_POLICY_TEMPLATE.md
          if ! git diff --cached --quiet; then
            git commit -m "NuScan M7.1 verified release fix"
            git push
          fi

      - name: Prepare diagnose
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nuscan-m7-1-diagnose
          cp /tmp/nuscan-m7-1-debug-build.log /tmp/nuscan-m7-1-diagnose/debug-build.log 2>/dev/null || true
          cp /tmp/nuscan-m7-1-release-build.log /tmp/nuscan-m7-1-diagnose/release-build.log 2>/dev/null || true
          cp app/proguard-rules.pro /tmp/nuscan-m7-1-diagnose/proguard-rules.pro 2>/dev/null || true
          find app/build -name missing_rules.txt -exec cp {} /tmp/nuscan-m7-1-diagnose/missing_rules.txt \; 2>/dev/null || true
          {
            echo "NUSCAN M7.1 BUILD DIAGNOSE"
            echo "==========================="
            echo
            echo "DEBUG STEP: ${{ steps.debug_build.outcome || 'not-run' }}"
            echo "DEBUG BUILD EXIT CODE: ${{ steps.debug_build.outputs.exit_code || 'not-run' }}"
            echo "RELEASE STEP: ${{ steps.release_build.outcome || 'not-run' }}"
            echo "RELEASE BUILD EXIT CODE: ${{ steps.release_build.outputs.exit_code || 'not-run' }}"
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            grep -nE '(^e: |FAILURE:|Execution failed|Unresolved reference|Cannot infer|error:|Exception|Missing class)' /tmp/nuscan-m7-1-debug-build.log /tmp/nuscan-m7-1-release-build.log 2>/dev/null | head -120 || true
            echo
            echo "R8 RULE"
            echo "-------"
            cat app/proguard-rules.pro || true
            echo
            echo "VERSIONS"
            echo "--------"
            grep -E 'compileSdk|targetSdk|versionCode|versionName|billing:|play-services-ads:|user-messaging-platform:|play-services-code-scanner:' app/build.gradle.kts || true
          } > /tmp/nuscan-m7-1-diagnose/summary.txt
          cp app/build.gradle.kts /tmp/nuscan-m7-1-diagnose/app-build.gradle.kts 2>/dev/null || true
          cp app/src/main/AndroidManifest.xml /tmp/nuscan-m7-1-diagnose/AndroidManifest.xml 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/NuScanApp.kt /tmp/nuscan-m7-1-diagnose/NuScanApp.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/ProPage.kt /tmp/nuscan-m7-1-diagnose/ProPage.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/monetization/ProBillingController.kt /tmp/nuscan-m7-1-diagnose/ProBillingController.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/monetization/PrivacyConsentController.kt /tmp/nuscan-m7-1-diagnose/PrivacyConsentController.kt 2>/dev/null || true

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.1-diagnose
          path: /tmp/nuscan-m7-1-diagnose/
          if-no-files-found: warn
