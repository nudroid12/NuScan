        run: |
          set -euo pipefail
          rm -rf app gradle
          rm -f build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat README.md THIRD_PARTY_NOTICES.md PLAY_STORE_RELEASE_CHECKLIST.md PRIVACY_POLICY_TEMPLATE.md SCAN_FIX_NOTES.md d.kt
