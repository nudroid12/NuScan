name: NuScan M6 Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuscan-m6.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36"
          fi

      - name: Apply NuScan M6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app gradle
          rm -f build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat README.md THIRD_PARTY_NOTICES.md d.kt
