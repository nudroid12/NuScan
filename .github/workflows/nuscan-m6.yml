      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/nudroidlabs/nuscan/QrToolsPage.kt
          test -f app/src/main/java/com/nudroidlabs/nuscan/monetization/ProBillingController.kt
          ! grep -R "com.google.android.gms.codescanner" app/src/main/java
          grep -R "com.google.mlkit.vision.codescanner" app/src/main/java
          grep -q 'versionName = "0.6.0-m6"' app/build.gradle.kts
          grep -q 'com.android.billingclient:billing:9.1.0' app/build.gradle.kts
          grep -q 'com.google.android.gms:play-services-ads:25.4.0' app/build.gradle.kts

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/nuscan-m6-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M6-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit verified M6 source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat gradle README.md THIRD_PARTY_NOTICES.md
          if ! git diff --cached --quiet; then
            git commit -m "NuScan M6 verified source"
            git push
          fi

      - name: Prepare diagnose
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nuscan-m6-diagnose
          cp /tmp/nuscan-m6-build.log /tmp/nuscan-m6-diagnose/build.log 2>/dev/null || true
          {
            echo "NUSCAN M6 BUILD DIAGNOSE"
            echo "========================"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "RESULT: SUCCESS"
              echo "BUILD EXIT CODE: 0"
            else
              echo "RESULT: FAILED"
              echo "BUILD EXIT CODE: ${{ steps.build.outputs.exit_code || 'unknown' }}"
            fi
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            grep -nE '(^e: |FAILURE:|Execution failed|Unresolved reference|Cannot infer|error:|Exception)' /tmp/nuscan-m6-build.log 2>/dev/null | head -80 || true
            echo
            echo "VERSIONS"
            echo "--------"
            grep -E 'versionCode|versionName|billing:|play-services-ads:|play-services-code-scanner:' app/build.gradle.kts || true
          } > /tmp/nuscan-m6-diagnose/summary.txt
          cp app/build.gradle.kts /tmp/nuscan-m6-diagnose/app-build.gradle.kts 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/QrToolsPage.kt /tmp/nuscan-m6-diagnose/QrToolsPage.kt 2>/dev/null || true
          cp app/src/main/java/com/nudroidlabs/nuscan/monetization/ProBillingController.kt /tmp/nuscan-m6-diagnose/ProBillingController.kt 2>/dev/null || true

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M6-diagnose
          path: /tmp/nuscan-m6-diagnose/
          if-no-files-found: warn
