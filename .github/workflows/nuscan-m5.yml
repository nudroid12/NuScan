          vhd6I8Kj7YtAwITEUUqzKKEkrZRnHUXRKChry3IZezkJt1m7xAsqu+VgOhS2D6Mkmx78qfxUlCGJ
          STgk4eC8R9IoEK/zF57BvnipQLK3vfmdu1sf904OPp0c9g7+7mx/Pul1Dg+O1h56CeIs+YA4TKJv
          ZJDV+AIC1EJqscZRoeEgmAzJW/VPL47VNXhegoCAgICAgICA/CLyH7JEy4oA6AMA
          NUSCAN_M5_PAYLOAD
          base64 --decode /tmp/nuscan-m5.b64 > /tmp/nuscan-m5.tar.gz
          tar -xzf /tmp/nuscan-m5.tar.gz -C .
          chmod +x gradlew 2>/dev/null || true

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.5.0-m5"' app/build.gradle.kts
          grep -q 'play-services-code-scanner:16.1.0' app/build.gradle.kts
          grep -q 'com.google.zxing:core:3.5.4' app/build.gradle.kts
          test -f app/src/main/java/com/nudroidlabs/nuscan/SignPdfPage.kt
          test -f app/src/main/java/com/nudroidlabs/nuscan/ProtectPdfPage.kt
          test -f app/src/main/java/com/nudroidlabs/nuscan/QrToolsPage.kt
          test -f app/src/main/java/com/nudroidlabs/nuscan/pdf/PdfSigner.kt
          test -f app/src/main/java/com/nudroidlabs/nuscan/pdf/PdfSecurity.kt
          if grep -R --line-number 'kotlinOptions' app build.gradle.kts 2>/dev/null; then
            echo 'Legacy kotlinOptions configuration found.'
            exit 1
          fi

      - name: Build debug APK
        id: appbuild
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee gradle-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit M5 source after successful build
        if: steps.appbuild.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "NuScan M5 signing protection and QR milestone [skip ci]"
            git push
          fi

      - name: Create diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf diagnose
          mkdir -p diagnose/source
          cp gradle-build.log diagnose/gradle-build.log 2>/dev/null || true
          gradle --version > diagnose/gradle-version.txt 2>&1 || true
          java -version > diagnose/java-version.txt 2>&1 || true
          git status --short > diagnose/git-status.txt 2>&1 || true
          cp app/build.gradle.kts diagnose/source/app-build.gradle.kts 2>/dev/null || true
          cp build.gradle.kts diagnose/source/root-build.gradle.kts 2>/dev/null || true
          cp settings.gradle.kts diagnose/source/settings.gradle.kts 2>/dev/null || true
          cp gradle.properties diagnose/source/gradle.properties 2>/dev/null || true
          cp README.md diagnose/source/README.md 2>/dev/null || true
          cp THIRD_PARTY_NOTICES.md diagnose/source/THIRD_PARTY_NOTICES.md 2>/dev/null || true
          find app/src -type f -print0 2>/dev/null | while IFS= read -r -d '' file; do
            target="diagnose/source/$file"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done
          find . -maxdepth 8 -type f \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -not -path './app/build/*' \
            -not -path './diagnose/*' \
            | sort > diagnose/project-files.txt

          {
            echo "NUSCAN M5 BUILD DIAGNOSE"
            echo "========================"
            echo
            if [ "${{ steps.appbuild.outputs.exit_code }}" = "0" ]; then
              echo "RESULT: SUCCESS"
            else
              echo "RESULT: FAILED"
            fi
            echo "BUILD EXIT CODE: ${{ steps.appbuild.outputs.exit_code }}"
            echo
            echo "PRIMARY ERROR CANDIDATES"
            echo "------------------------"
            if [ -f gradle-build.log ]; then
              grep -nE '(^e: |FAILURE:|What went wrong:|Execution failed for task|Could not resolve|Could not find|error: |Exception|Caused by:|Unresolved reference|Compilation error)' gradle-build.log | tail -n 300 || true
            fi
          } > diagnose/summary.txt

          zip -qr NuScan-M5-diagnose.zip diagnose

      - name: Upload debug APK
        if: steps.appbuild.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M5-diagnose
          path: NuScan-M5-diagnose.zip
          if-no-files-found: error

      - name: Mark failed build
        if: steps.appbuild.outputs.exit_code != '0'
        run: exit 1
