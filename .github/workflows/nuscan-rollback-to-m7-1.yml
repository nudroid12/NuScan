          set -euo pipefail
          if grep -R -n -E 'org\.opencv|androidx\.camera|PerspectiveCorrector|DocumentEdge' app/src app/build.gradle.kts 2>/dev/null; then
            echo "ERROR: M7.2 custom scanner code is still present."
            exit 1
          fi
          echo "Custom CameraX/OpenCV scanner code is absent."

      - name: Build debug APK
        id: debug_build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/debug-build.log

      - name: Upload rollback debug APK
        if: steps.debug_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.1-rollback-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release candidate AAB
        id: release_build
        if: steps.debug_build.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:bundleRelease --stacktrace 2>&1 | tee /tmp/release-build.log

      - name: Upload rollback release candidate AAB
        if: steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.1-rollback-release-candidate-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit restored M7.1 baseline
        if: steps.debug_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository is already at the M7.1 baseline."
          else
            git commit -m "rollback: restore NuScan M7.1 baseline"
            git push origin HEAD:main
          fi

      - name: Prepare diagnose
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/nuscan-rollback-diagnose
          cp /tmp/debug-build.log /tmp/nuscan-rollback-diagnose/debug-build.log 2>/dev/null || true
          cp /tmp/release-build.log /tmp/nuscan-rollback-diagnose/release-build.log 2>/dev/null || true
          git status --short > /tmp/nuscan-rollback-diagnose/git-status.txt 2>&1 || true
          git log -5 --oneline > /tmp/nuscan-rollback-diagnose/git-log.txt 2>&1 || true
          find app/src/main -type f | sort > /tmp/nuscan-rollback-diagnose/source-files.txt 2>&1 || true
          {
            echo "NUSCAN M7.1 ROLLBACK DIAGNOSE"
            echo "============================"
            echo "DEBUG OUTCOME: ${{ steps.debug_build.outcome }}"
            echo "RELEASE OUTCOME: ${{ steps.release_build.outcome }}"
            echo
            echo "Target baseline: NuScan M7.1"
            echo "Custom scanner target: REMOVED"
          } > /tmp/nuscan-rollback-diagnose/summary.txt
          cd /tmp
          zip -qr NuScan-M7.1-rollback-diagnose.zip nuscan-rollback-diagnose

      - name: Upload diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NuScan-M7.1-rollback-diagnose
          path: /tmp/NuScan-M7.1-rollback-diagnose.zip
          if-no-files-found: warn

      - name: Fail job if debug build failed
        if: steps.debug_build.outcome != 'success'
        shell: bash
        run: exit 1
