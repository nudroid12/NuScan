name: NuScan Rollback to M7.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36"
          fi

      - name: Restore exact M7.1 source
        shell: bash
        run: |
          set -euo pipefail

          # Remove the current application tree first. This guarantees that
          # CameraX/OpenCV files introduced by M7.2/M7.2.1 cannot survive.
          rm -rf app gradle
          rm -f build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat
          rm -f README.md THIRD_PARTY_NOTICES.md PLAY_STORE_RELEASE_CHECKLIST.md PRIVACY_POLICY_TEMPLATE.md d.kt

          # Disable the two custom-scanner workflows so they cannot be run again by mistake.
          rm -f .github/workflows/nuscan-m7-2-scanfix.yml
          rm -f .github/workflows/nuscan-m7-2-1-scanfix.yml

          cat > /tmp/nuscan-m7-1-rollback.b64 <<'NUSCAN_M7_1_ROLLBACK_PAYLOAD'
